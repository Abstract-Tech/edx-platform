{% load i18n %}

<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
{% get_current_language as LANGUAGE_CODE %}
<title lang="{{ LANGUAGE_CODE|default:"en" }}">
  {% block title %}
  {% filter force_escape %}{% blocktrans %}{{ platform_name }} Email{% endblocktrans %}{% endfilter %}
  {% endblock %}
</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style type="text/css">

      font-family: 'Gantari';
      src: local('Gantari Thin'), url('{{ font_urls.thin }}') format('truetype');
      font-weight: 100;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gantari';
      src: local('Gantari ExtraLight'), url('{{ font_urls.extra_light }}') format('truetype');
      font-weight: 200;

      font-display: swap;
    }
    @font-face {
      font-family: 'Gantari';
      src: local('Gantari Light'), url('{{ font_urls.light }}') format('truetype');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

      font-family: 'Gantari';
      src: local('Gantari Regular'), url('{{ font_urls.regular }}') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gantari';
      src: local('Gantari Medium'), url('{{ font_urls.medium }}') format('truetype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gantari';
      src: local('Gantari SemiBold'), url('{{ font_urls.semi_bold }}') format('truetype');

      font-style: normal;

      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gantari';
      src: local('Gantari ExtraBold'), url('{{ font_urls.extra_bold }}') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gantari';
      src: local('Gantari Black'), url('{{ font_urls.black }}') format('truetype');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {

      font-weight: 300;
      font-style: italic;
      font-display: swap;
    }

      font-weight: 700;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gantari';
      src: local('Gantari ExtraBold Italic'), url('{{ font_urls.extra_bold_italic }}') format('truetype');
      font-weight: 800;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gantari';
      src: local('Gantari Black Italic'), url('{{ font_urls.black_italic }}') format('truetype');
      font-weight: 900;

      font-style: italic;
      font-display: swap;
    }

    @media only screen and (min-device-width: 601px) {
      .content {
        width: 600px !important;
      }
    }

    @-ms-viewport{
      width: device-width;
    }

    /* Column Drop Layout Pattern CSS */
    @media only screen and (max-width: 450px) {
      td[class="col"] {
        display: block;
        width: 100%;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
        float: left;
        text-align: left !important;
        padding-bottom: 20px;
      }
    }
    * {margin-top:0px;margin-bottom:0px;padding:0px;border:none;outline:none;list-style:none;-webkit-text-size-adjust: none;}
    body {margin:0 !important;padding:0 !important;width: 100% !important;-webkit-text-size-adjust: 100% !important;-ms-text-size-adjust: 100% !important;-webkit-font-smoothing: antialiased !important;}
    img {border:0 !important;display: block !important;outline: none !important;}
    table {border-collapse: collapse;mso-table-lspace:0px;mso-table-rspace: 0px;}
    td {border-collapse:collapse;mso-line-height-rule:exactly;}

    @media only screen and (max-width:480px){
      .width_100percent {width: 100% !important;}
      .min_width {min-width: 320px !important;}
      .mobile_img {width: 100% !important; height: auto !important;}
      .background_none {background: none !important;}
      .display_block {display: block !important;}

      .height_0 {height: 0 !important;}
      .padding_none {padding-left: 0 !important; padding-right: 0 !important;}
      .paddingtop_10 {padding-top: 10px !important;}
